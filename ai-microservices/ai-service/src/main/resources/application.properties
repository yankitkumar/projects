spring.application.name=ai-service
server.port=8082

# Claude is used only when an API key is present; otherwise the rule-based analyzer answers.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}
# Empty means the SDK default (https://api.anthropic.com). Deliberately not bound to ANTHROPIC_BASE_URL;
# tests point it at a local stub.
ai.anthropic.base-url=

management.endpoints.web.exposure.include=health,info
