spring.application.name=ticket-service
server.port=8081

ai-service.url=${AI_SERVICE_URL:http://localhost:8082}
ai-service.connect-timeout=2s
# Must stay above ai-service's worst case for a Claude call (~80s, see its AnthropicConfig),
# so a slow Claude still reaches us as a rules-engine answer rather than a timeout.
ai-service.read-timeout=90s

management.endpoints.web.exposure.include=health,info
